name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build universal app and zip
        run: scripts/build.sh release
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MacClipHistory
          path: dist/
